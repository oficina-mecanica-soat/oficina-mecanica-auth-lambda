name: "🧪 CI"
run-name: "🧪 Validar código · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches:
      - develop
      - release
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "OficinaMecanica.AuthLambda.slnx"
  FUNCTION_PROJECT_PATH: "src/OficinaMecanica.AuthLambda.Function/OficinaMecanica.AuthLambda.Function.csproj"
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  TERRAFORM_VERSION: "1.15.8"
  COVERAGE_THRESHOLD: "90"

jobs:
  detect_ci_scope:
    name: "🔎 00 · Detectar escopo do PR"
    runs-on: ubuntu-latest
    outputs:
      ci_required: ${{ steps.detect.outputs.ci_required }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 02 · Analisar arquivos alterados"
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ci_required=false
          changed_files="$(mktemp)"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          if [ ! -s "$changed_files" ]; then
            echo "No changed files found. Running full CI for safety."
            ci_required=true
          else
            echo "Changed files:"
            cat "$changed_files"

            while IFS= read -r file; do
              case "$file" in
                *.md)
                  ;;
                *)
                  ci_required=true
                  break
                  ;;
              esac
            done < "$changed_files"
          fi

          echo "ci_required=$ci_required" >> "$GITHUB_OUTPUT"
          echo "CI required: $ci_required"

  validate_git_flow:
    name: "🔀 01 · Validar fluxo de branches"
    runs-on: ubuntu-latest

    steps:
      - name: "🔀 01 · Conferir origem e destino do PR"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"

          case "$BASE_BRANCH" in
            develop)
              case "$HEAD_BRANCH" in
                main|release|release/*)
                  echo "Protected stage branches must not open pull requests back to develop."
                  exit 1
                  ;;
                *)
                  echo "Pull request to develop follows the Git Flow entry point."
                  ;;
              esac
              ;;

            release|release/*)
              if [ "$HEAD_BRANCH" != "develop" ]; then
                echo "Pull requests to release must come from develop."
                exit 1
              fi

              echo "Pull request to release follows the Git Flow promotion path."
              ;;

            main)
              case "$HEAD_BRANCH" in
                release|release/*)
                  echo "Pull request to main follows the Git Flow production promotion path."
                  ;;
                *)
                  echo "Pull requests to main must come from release or release/*."
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Unsupported protected base branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

  build_solution:
    name: "🏗️ 02 · Build da solução"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências da solução"
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: "🔨 05 · Compilar a solução"
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  verify_code_style:
    name: "🎨 03 · Verificar padrão de código"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📚 03 · Resolver dependências da solução"
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: "✅ 04 · Verificar formatação do código"
        run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --no-restore

  test_solution:
    name: "🧪 04 · Testar solução"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências da solução"
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: "🔨 05 · Compilar a solução"
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: "🧪 06 · Executar testes com cobertura"
        run: >
          dotnet test ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx"

      - name: "🔍 07 · Validar resultados dos testes"
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path TestResults -Recurse -Filter *.trx

          if (-not $trxFiles) {
            throw "No TRX test result files were generated."
          }

          $total = 0
          $passed = 0
          $failed = 0
          $skipped = 0

          foreach ($trxFile in $trxFiles) {
            [xml]$trx = Get-Content -LiteralPath $trxFile.FullName
            $counters = $trx.TestRun.ResultSummary.Counters

            $total += [int]$counters.total
            $passed += [int]$counters.passed
            $failed += [int]$counters.failed
            $skipped += [int]$counters.notExecuted
          }

          Write-Host "Tests: total=$total passed=$passed failed=$failed skipped=$skipped"

          if ($total -eq 0) {
            throw "Nenhum teste foi executado."
          }

          if ($failed -gt 0) {
            throw "There are failing tests."
          }

          if ($skipped -gt 0) {
            throw "CI requires zero skipped tests."
          }

      - name: "📊 08 · Gerar relatório de cobertura"
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: "📈 09 · Validar limite mínimo de cobertura"
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content -LiteralPath TestResults/CoverageReport/Cobertura.xml
          $lineRate = [double]::Parse($coverage.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
          $lineCoverage = [math]::Round($lineRate * 100, 2)
          $threshold = [double]::Parse("${{ env.COVERAGE_THRESHOLD }}", [System.Globalization.CultureInfo]::InvariantCulture)

          Write-Host "Line coverage: $lineCoverage%"
          Write-Host "Required threshold: $threshold%"

          if ($lineCoverage -lt $threshold) {
            throw "Line coverage $lineCoverage% is below the required $threshold% threshold."
          }

      - name: "⬆️ 10 · Publicar artefatos de teste e cobertura"
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/CoverageReport/**
          if-no-files-found: error

  verify_vulnerable_packages:
    name: "🛡️ 05 · Verificar pacotes vulneráveis"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📚 03 · Resolver dependências da solução"
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: "🛡️ 04 · Verificar pacotes vulneráveis"
        shell: pwsh
        run: |
          dotnet list $env:SOLUTION_PATH package --vulnerable --include-transitive | Tee-Object -FilePath vulnerable-packages.txt
          $exitCode = $LASTEXITCODE

          $output = Get-Content -Raw -LiteralPath vulnerable-packages.txt

          if ($exitCode -ne 0) {
            throw "Vulnerable package check failed with exit code $exitCode."
          }

          if ($output -match 'has the following vulnerable packages' -or
              $output -match 'tem os seguintes pacotes vulneráveis') {
            throw "Vulnerable packages were found."
          }

  validate_terraform:
    name: "🌐 05.1 · Validar Terraform da Auth Lambda"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "🧪 Validar bloqueio de AWS sem laboratório"
        run: |
          node <<'TESTAR_BLOQUEIO_AWS'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const ler = nome => fs.readFileSync('.github/workflows/' + nome, 'utf8').replace(/\r\n/g, '\n');
          const deploy = ler('aws-deploy.yml');
          const cd = ler('cd-development.yml');
          const bash = process.platform === 'win32' ? 'C:/Program Files/Git/bin/bash.exe' : 'bash';
          const gate = texto => {
            const bloco = texto.match(/      - name: "🛡️ Conferir habilitação do deploy AWS"\n([\s\S]*?)(?=      - name:|$)/);
            assert(bloco, 'Barreira de AWS ausente.');
            assert(bloco[1].includes('DEPLOY_ENABLED: \u0024{{ vars.AWS_DEPLOY_ENABLED }}'));
            const script = bloco[1].split('        run: |\n')[1];
            assert(script, 'Validação executável ausente.');
            return script.split('\n').map(l => l.slice(10)).join('\n').trim();
          };
          function conferirBloqueio(texto) {
            const script = gate(texto);
            function executar(flag, ref = 'refs/heads/develop', ambiente = 'development') {
              const env = { ...process.env, GITHUB_REF: ref, DEPLOY_ENVIRONMENT: ambiente };
              delete env.DEPLOY_ENABLED;
              if (flag !== undefined) env.DEPLOY_ENABLED = flag;
              const resultado = cp.spawnSync(bash, ['-e', '-c', script], { env, encoding: 'utf8' });
              assert.ifError(resultado.error);
              return resultado.status;
            }
            for (const valor of [undefined, '', 'false', 'TRUE', 'true ']) {
              assert.notEqual(executar(valor), 0, 'Valor deve bloquear: ' + valor);
            }
            assert.equal(executar('true'), 0);
            for (const ref of ['refs/heads/main', 'refs/heads/release', 'refs/heads/feature/teste', 'refs/tags/develop']) {
              assert.notEqual(executar('true', ref), 0, 'Ref indevida deve bloquear.');
            }
            assert.notEqual(executar('true', 'refs/heads/develop', 'production'), 0);
            assert.notEqual(executar('true', 'refs/heads/develop', ''), 0);
          }
          conferirBloqueio(deploy);
          assert(deploy.includes('DEPLOY_ENVIRONMENT: \u0024{{ inputs.environment_name }}'), 'Barreira deve conferir o Environment solicitado.');
          assert(deploy.indexOf('🛡️ Conferir habilitação do deploy AWS') < deploy.indexOf('id: resolve'), 'Resolver ação somente após a barreira.');
          for (const nome of ['prepare_and_plan', 'apply_or_destroy']) {
            const job = deploy.split('\n  ' + nome + ':')[1]?.split(/\n  [a-z_]+:/)[0];
            assert(job && /needs:[\s\S]*?resolve_action/.test(job), 'Job AWS deve depender da barreira.');
          }
          if (fs.existsSync('.github/workflows/datadog-observability.yml')) {
            const datadog = ler('datadog-observability.yml');
            conferirBloqueio(datadog);
            const job = datadog.split('\n  deploy-datadog:')[1];
            assert(job.includes("if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/develop'"));
            assert(datadog.indexOf('🛡️ Conferir habilitação do deploy AWS') < datadog.indexOf('aws-actions/configure-aws-credentials'), 'Datadog deve bloquear antes das credenciais.');
            assert(cd.includes("vars.AWS_DEPLOY_ENABLED == 'true'"), 'Caller do Datadog deve preservar a barreira.');
          } else {
            const job = cd.split('\n  deploy-development:')[1].split('\n  open-pr-to-release:')[0];
            assert(job.includes("if: needs.detect-deploy-scope.outputs.deploy_required == 'true' && vars.AWS_DEPLOY_ENABLED == 'true'"), 'Caller deve exigir flag e mudança implantável.');
          }
          console.log('Barreira AWS: ausência/false bloqueiam; true exige develop/development; caller e callee protegidos, sem consulta AWS.');
          TESTAR_BLOQUEIO_AWS

      - name: "🧪 Validar promoção cumulativa sem AWS"
        run: |
          node <<'TESTAR_PROMOCAO_CUMULATIVA'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const workflow = fs.readFileSync('.github/workflows/cd-development.yml', 'utf8');
          const bloco = workflow.match(/node <<'VALIDAR_PROMOCAO_CUMULATIVA'\r?\n([\s\S]*?)          VALIDAR_PROMOCAO_CUMULATIVA/);
          assert(bloco, 'Guarda cumulativa ausente.');
          const codigo = bloco[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const validar = new Function(codigo.split('// Execução no runner:')[0] + '; return validarPromocao;')();
          const detector = workflow.match(/node <<'DETECTAR_DEPLOY'\r?\n([\s\S]*?)          DETECTAR_DEPLOY/)[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const caminhos = JSON.parse(workflow.match(/DEPLOYABLE_PATHS: >-\r?\n((?:    [^\n]*\r?\n)+)/)[1]);
          const diretorio = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'promocao-cumulativa-'));
          try {
            const git = args => cp.execFileSync('git', args, { cwd: diretorio, encoding: 'utf8' }).trim();
            git(['init', '-b', 'develop']);
            git(['config', 'user.email', 'teste@example.invalid']);
            git(['config', 'user.name', 'Teste local']);
            const gravar = (nome, conteudo) => {
              fs.mkdirSync(path.dirname(path.join(diretorio, nome)), { recursive: true });
              fs.writeFileSync(path.join(diretorio, nome), conteudo);
              git(['add', nome]);
              git(['commit', '-m', 'cenário local']);
              return git(['rev-parse', 'HEAD']);
            };
            const base = gravar('README.md', 'base');
            const docs = gravar('README.md', 'documentação');
            const consultarNunca = () => { throw new Error('Consulta inesperada.'); };
            const opcoes = { git, caminhos, base, head: docs, consultar: consultarNunca };
            assert.equal(validar(opcoes), 'SEM_ALTERACAO_IMPLANTAVEL');

            git(['switch', '-c', 'feature/teste']);
            gravar('infra/terraform/exemplo.tf', 'código');
            git(['switch', 'develop']);
            git(['merge', '--no-ff', 'feature/teste', '-m', 'merge funcional']);
            const implantavel = git(['rev-parse', 'HEAD']);
            const head = gravar('README.md', 'documentação depois do código');
            const detectar = (antes, atual) => {
              const saida = path.join(diretorio, 'saida-runner.txt');
              fs.writeFileSync(saida, '');
              cp.execFileSync(process.execPath, ['-e', detector], {
                cwd: diretorio,
                env: { ...process.env, DEPLOYABLE_PATHS: JSON.stringify(caminhos), GITHUB_BEFORE: antes, GITHUB_SHA: atual, GITHUB_OUTPUT: saida }
              });
              return fs.readFileSync(saida, 'utf8').trim();
            };
            assert.equal(detectar(base, implantavel), 'deploy_required=true');
            assert.equal(detectar(implantavel, head), 'deploy_required=false');
            let chamadas = [];
            const run = { id: 123, run_attempt: 2, head_sha: implantavel, head_branch: 'develop', event: 'push', status: 'completed', conclusion: 'success' };
            const job = { name: '☁️ 02 · Deploy em development / ☁️ 03 · Aplicar ou destruir Auth Lambda', conclusion: 'success' };
            const consultar = endpoint => {
              chamadas.push(endpoint);
              return endpoint.startsWith('actions/workflows/') ? [{ workflow_runs: [run] }] : [{ jobs: [job] }];
            };
            const comCodigo = { ...opcoes, head, consultar };
            assert.throws(() => validar({ ...comCodigo, consultar: () => [{ workflow_runs: [] }] }), /sem CD/);
            assert.equal(validar(comCodigo), 'OPERACAO_ANTERIOR_CONFIRMADA');
            assert(chamadas[0].includes('head_sha=' + implantavel), 'Deve buscar o merge em develop, não o commit da feature/documentação.');
            assert(chamadas[1].includes('/attempts/2/jobs'), 'Deve consultar a tentativa atual.');
            for (const estado of ['skipped', 'failure', 'cancelled']) {
              job.conclusion = estado;
              assert.throws(() => validar(comCodigo), /sem aplicação/);
            }
            job.conclusion = 'success';
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => endpoint.startsWith('actions/workflows/') ? [{ workflow_runs: [run] }] : [{}] }), /Jobs/);
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => [{ workflow_runs: [{ ...run, head_sha: '0'.repeat(40) }] }] }), /sem CD/);
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => [{ workflow_runs: [run, { ...run, id: 124, conclusion: 'failure' }] }] }), /sem CD/);
            run.conclusion = 'failure';
            assert.throws(() => validar(comCodigo), /sem CD/);
            run.conclusion = 'success';
            run.status = 'in_progress';
            assert.throws(() => validar(comCodigo), /sem CD/);
            run.status = 'completed';
            assert.throws(() => validar({ ...comCodigo, consultar: consultarNunca }), /Consulta inesperada/);
            assert.throws(() => validar({ ...comCodigo, consultar: () => ({}) }), /Histórico/);
            assert.equal(validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'success', acaoAtual: 'apply' }), 'OPERACAO_ATUAL_CONFIRMADA');
            assert.equal(validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'success', acaoAtual: 'destroy' }), 'OPERACAO_ATUAL_CONFIRMADA');
            assert.throws(() => validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'skipped', acaoAtual: 'apply' }), /Consulta inesperada/);
            gravar('infra/terraform/exemplo.tf', 'outro código ainda sem deploy');
            const posterior = gravar('README.md', 'mais documentação');
            assert.throws(() => validar({ ...comCodigo, head: posterior }), /sem CD/);
            gravar('infra/terraform/exemplo.tf', 'código');
            assert.equal(validar({ ...comCodigo, base: implantavel, head: git(['rev-parse', 'HEAD']), consultar: consultarNunca }), 'SEM_ALTERACAO_IMPLANTAVEL');
            console.log('Promoção cumulativa: código sem deploy bloqueado; código implantado seguido de docs permitido; falhas, skips, reruns e novo código protegidos.');
          } finally {
            assert.equal(path.dirname(fs.realpathSync(diretorio)), fs.realpathSync(process.env.RUNNER_TEMP || os.tmpdir()));
            fs.rmSync(diretorio, { recursive: true, force: true });
          }
          TESTAR_PROMOCAO_CUMULATIVA

      - name: "🧪 Validar artefatos e cache por tentativa"
        run: |
          node <<'TESTAR_ARTEFATOS_TENTATIVA'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const workflow = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8').replace(/\r\n/g, '\n');
          const etapas = workflow.split(/(?=      - name:)/);
          const upload = etapas.filter(s => /uses: actions\/upload-artifact@/.test(s));
          const download = etapas.filter(s => /uses: actions\/download-artifact@/.test(s));
          const restores = etapas.filter(s => /uses: actions\/cache\/restore@/.test(s));
          const saves = etapas.filter(s => /uses: actions\/cache\/save@/.test(s));
          assert(upload.length > 0 && upload.length === download.length);
          assert.equal(restores.length, 2);
          assert.equal(saves.length, 1);
          const valor = (etapa, campo) => {
            const encontrado = etapa.match(new RegExp('^          ' + campo + ': (.+)$', 'm'));
            assert(encontrado, 'Campo obrigatório: ' + campo);
            return encontrado[1];
          };
          // Escapar o dólar impede interpolação prematura pelo próprio GitHub Actions no teste.
          const expressao = nome => '\u0024{{ ' + nome + ' }}';
          const expandir = (modelo, tentativa = 1, execucao = 100, conta = '111111111111', ambiente = 'development') => modelo
            .replaceAll(expressao('github.run_id'), String(execucao))
            .replaceAll(expressao('github.run_attempt'), String(tentativa))
            .replaceAll(expressao('steps.aws_credentials.outputs.aws-account-id'), conta)
            .replaceAll(expressao('inputs.environment_name'), ambiente);
          for (const produtor of upload) {
            const nome = valor(produtor, 'name');
            assert(nome.includes(expressao('github.run_id')) && nome.includes(expressao('github.run_attempt')));
            const consumidores = download.filter(s => valor(s, 'name') === nome);
            assert.equal(consumidores.length, 1, 'Download deve usar exatamente o nome publicado.');
            assert(produtor.includes('if-no-files-found: error'));
            assert(!consumidores[0].includes('pattern:') && !consumidores[0].includes('continue-on-error:'), 'Sem fallback silencioso de artefato.');
            const tentativa1 = expandir(nome);
            const tentativa2 = expandir(nome, 2);
            assert.notEqual(tentativa1, tentativa2, 'Rerun não pode colidir com artefato imutável anterior.');
            assert.notEqual(tentativa2, expandir(nome, 2, 101), 'Execuções diferentes devem permanecer isoladas.');
            const publicados = new Map([[tentativa1, 'conteúdo da primeira tentativa']]);
            assert(!publicados.has(tentativa2), 'Sem nova publicação, a segunda tentativa não pode baixar a primeira.');
            publicados.set(tentativa2, 'conteúdo da segunda tentativa');
            assert.equal(publicados.get(expandir(valor(consumidores[0], 'name'), 2)), 'conteúdo da segunda tentativa');
          }
          const chaveFinal = valor(saves[0], 'key');
          assert(saves[0].includes('if: always()'), 'Falha do apply não pode pular a preservação do state.');
          for (const etapa of [...restores, ...saves]) {
            const chave = valor(etapa, 'key');
            for (const campo of ['github.run_id', 'github.run_attempt', 'steps.aws_credentials.outputs.aws-account-id', 'inputs.environment_name']) {
              assert(chave.includes(expressao(campo)), 'Cache deve preservar conta, ambiente, execução e tentativa.');
            }
            assert.equal(chave, chaveFinal, 'Restaurar/salvar o mesmo escopo de state.');
            assert(etapa.includes('/terraform.tfstate') && etapa.includes('/terraform.tfstate.backup'));
          }
          for (const etapa of restores) {
            const prefixo = etapa.match(/          restore-keys: \|\n            ([^\n]+)/)?.[1];
            assert(prefixo && prefixo.includes(expressao('steps.aws_credentials.outputs.aws-account-id')) && prefixo.includes(expressao('inputs.environment_name')));
            assert.equal(expandir(chaveFinal).startsWith(expandir(prefixo)), true);
            assert.notEqual(expandir(prefixo), expandir(prefixo, 1, 100, '222222222222'));
            assert.notEqual(expandir(prefixo), expandir(prefixo, 1, 100, '111111111111', 'production'));
          }
          const antes = expandir(chaveFinal);
          const depois = expandir(chaveFinal, 2);
          assert.notEqual(antes, depois, 'State de falha parcial precisa de chave gravável na nova tentativa.');
          console.log('Artefatos/cache por execução e tentativa: nomes simétricos, sem reaproveitar plano/pacote anterior, conta/ambiente isolados e state sempre preservado na configuração.');
          TESTAR_ARTEFATOS_TENTATIVA

      - name: "🧪 Validar recuperação segura de destroy"
        run: node --test .github/scripts/*.test.cjs

      - name: "🧪 Validar ativação da consulta privada de clientes"
        run: |
          python - <<'TESTAR_CLIENTES'
          import contextlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          from unittest.mock import patch

          texto = Path('.github/workflows/aws-deploy.yml').read_text(encoding='utf-8')
          blocos = [s for s in re.findall(r"          python - <<'PY'\n(.*?)\n          PY", texto, re.S) if 'clientes_' in s and 'zz_ci.auto.tfvars.json' in s]
          assert blocos, 'Geração de variáveis privadas ausente.'
          for bloco in blocos:
              codigo = '\n'.join(linha[10:] for linha in bloco.splitlines())
              auth = 'clientes_api_habilitada' in codigo
              casos = [('destroy', 'true', '', False), ('apply', 'false', '', False), ('apply', 'true', 'token-ficticio-exclusivo-de-testes-2026', False), ('apply', 'TRUE', '', True), ('apply', 'true', '', True), ('apply', 'true', 'jwt-ficticio-exclusivo-de-testes-2026', True)]
              if auth:
                  casos += [('apply', 'true', 'token-ficticio-exclusivo-de-testes-2026', 'publico'), ('apply', 'true', 'token-ficticio-exclusivo-de-testes-2026', 'outra-vpc')]
              for acao, flag, token, falha in casos:
                  chamadas = []
                  def consultar(args, **kwargs):
                      chamadas.append(args)
                      if args[1:3] == ['ssm', 'get-parameter']:
                          nome = args[args.index('--name') + 1]
                          valor = {'endpoint': 'sql.test.local', 'master_secret_arn': 'arn-teste', 'internal_nlb_listener_arn': 'arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/net/teste/abc/def', 'internal_nlb_security_group_id': 'sg-teste', 'vpc_id': 'vpc-teste'}.get(nome.rsplit('/', 1)[-1], 'ready')
                      elif args[1:3] == ['sts', 'get-caller-identity']:
                          valor = '123456789012'
                      elif args[1:3] == ['elbv2', 'describe-listeners']:
                          valor = json.dumps({'Listeners': [{'Protocol': 'TCP', 'Port': 80, 'LoadBalancerArn': 'arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/net/teste/abc'}]})
                      elif args[1:3] == ['elbv2', 'describe-load-balancers']:
                          valor = json.dumps({'LoadBalancers': [{'Type': 'network', 'Scheme': 'internet-facing' if falha == 'publico' else 'internal', 'VpcId': 'vpc-outra' if falha == 'outra-vpc' else 'vpc-teste', 'SecurityGroups': ['sg-teste'], 'DNSName': 'internal-teste.elb.us-east-1.amazonaws.com'}]})
                      elif args[1:3] == ['secretsmanager', 'get-secret-value']:
                          valor = json.dumps({'username': 'usuario-teste', 'password': 'senha-ficticia'})
                      else:
                          raise AssertionError('Comando inesperado no teste: ' + repr(args))
                      return subprocess.CompletedProcess(args, 0, stdout=valor)
                  with tempfile.TemporaryDirectory() as pasta:
                      ambiente = {'TERRAFORM_ACTION': acao, 'CLIENTES_API_ENABLED': flag, 'CLIENTES_INTERNOS_TOKEN': token, 'JWT_SECRET': 'jwt-ficticio-exclusivo-de-testes-2026', 'WEBHOOK_TOKEN': 'webhook-ficticio', 'AUTH_LAMBDA_JWT_SECRET': 'jwt-ficticio-exclusivo-de-testes-2026', 'AUTH_LAMBDA_JWT_ISSUER': 'issuer-teste', 'AUTH_LAMBDA_JWT_AUDIENCE': 'audience-teste', 'AUTH_LAMBDA_JWT_EXPIRATION_MINUTES': '60', 'AUTH_LAMBDA_EXECUTION_ROLE_NAME': 'LabRole', 'ECR_IMAGE_URI': 'teste.local/imagem:teste', 'AWS_REGION': 'us-east-1', 'SSM_ENVIRONMENT_NAME': 'development', 'SSM_RDS_PREFIX': '/teste/rds', 'SSM_VPC_PREFIX': '/teste/vpc', 'SSM_KUBERNETES_PREFIX': '/teste/kubernetes', 'SSM_API_STATUS_PARAMETER': '/teste/status/api', 'TF_WORKING_DIRECTORY': pasta, 'DD_VERSION': 'teste', 'LAMBDA_PACKAGE_SOURCE_CODE_HASH': 'hash-teste'}
                      try:
                          with patch.dict(os.environ, ambiente, clear=True), patch('subprocess.run', side_effect=consultar), contextlib.redirect_stdout(io.StringIO()):
                              exec(compile(codigo, 'tfvars-do-workflow', 'exec'), {})
                      except ValueError:
                          assert falha, 'Cenário válido rejeitado.'
                      else:
                          assert not falha, 'Cenário inseguro foi aceito.'
                          values = json.loads((Path(pasta) / 'zz_ci.auto.tfvars.json').read_text(encoding='utf-8'))
                          habilitado = flag == 'true' and acao != 'destroy'
                          assert values['clientes_api_habilitada' if auth else 'clientes_internos_habilitado'] == habilitado
                          if acao == 'destroy':
                              assert not chamadas, 'Destroy não pode depender de novos contratos ou secrets.'
                          if auth and habilitado:
                              assert values['connection_string'] == ''
                              assert values['clientes_api_endereco_base'] == 'http://internal-teste.elb.us-east-1.amazonaws.com'
                              assert not any(a[1] == 'secretsmanager' for a in chamadas), 'Modo privado não pode ler a credencial SQL.'
          print('Contratos privados: ativação, isolamento de credenciais, dependências e destroy validados sem AWS.')
          TESTAR_CLIENTES

      - name: "🎨 03 · Verificar formatação Terraform"
        run: terraform fmt -check -recursive infra/terraform

      - name: "🚀 04 · Inicializar Terraform sem backend"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -backend=false -input=false

      - name: "🔍 05 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: "🧪 06 · Validar isolamento Terraform de clientes"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" test

  package_lambda:
    name: "📦 06 · Empacotar Lambda"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.slnx', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências da solução"
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: "📤 05 · Publicar projeto da Function"
        run: >
          dotnet publish ${{ env.FUNCTION_PROJECT_PATH }}
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output ./artifacts/auth-lambda/publish

      - name: "🗜️ 06 · Compactar pacote da Lambda"
        shell: pwsh
        run: |
          $publishPath = "./artifacts/auth-lambda/publish"
          $zipPath = "./artifacts/auth-lambda/oficina-mecanica-auth-lambda.zip"

          if (-not (Test-Path -LiteralPath $publishPath)) {
            throw "Publish directory was not generated."
          }

          Compress-Archive `
            -Path (Join-Path $publishPath "*") `
            -DestinationPath $zipPath `
            -Force

      - name: "✅ 07 · Validar pacote gerado"
        shell: pwsh
        run: |
          $zipPath = "./artifacts/auth-lambda/oficina-mecanica-auth-lambda.zip"

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Lambda package was not generated."
          }

          $zipFile = Get-Item -LiteralPath $zipPath

          if ($zipFile.Length -le 0) {
            throw "Lambda package is empty."
          }

          Write-Host "Lambda package: $($zipFile.FullName)"
          Write-Host "Lambda package size: $($zipFile.Length) bytes"

      - name: "⬆️ 08 · Publicar pacote da Lambda"
        uses: actions/upload-artifact@v7
        with:
          name: auth-lambda-package
          path: ./artifacts/auth-lambda/oficina-mecanica-auth-lambda.zip
          if-no-files-found: error

  quality_gate:
    name: "🚦 07 · Quality gate"
    runs-on: ubuntu-latest
    needs:
      - detect_ci_scope
      - validate_git_flow
      - build_solution
      - verify_code_style
      - test_solution
      - verify_vulnerable_packages
      - validate_terraform
      - package_lambda
    if: always()

    steps:
      - name: "🚦 01 · Conferir status de todos os jobs do CI"
        run: |
          if [ "${{ needs.detect_ci_scope.result }}" != "success" ]; then
            echo "CI scope detection failed."
            exit 1
          fi

          if [ "${{ needs.validate_git_flow.result }}" != "success" ]; then
            echo "Git Flow branch validation failed."
            exit 1
          fi

          if [ "${{ needs.detect_ci_scope.outputs.ci_required }}" != "true" ]; then
            echo "Only documentation or Markdown files changed. Heavy CI skipped safely."
            exit 0
          fi

          results=(
            "${{ needs.build_solution.result }}"
            "${{ needs.verify_code_style.result }}"
            "${{ needs.test_solution.result }}"
            "${{ needs.verify_vulnerable_packages.result }}"
            "${{ needs.validate_terraform.result }}"
            "${{ needs.package_lambda.result }}"
          )

          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "One or more CI responsibilities failed."
              exit 1
            fi
          done

          echo "All CI responsibilities passed."
