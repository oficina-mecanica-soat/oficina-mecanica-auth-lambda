name: "☁️ AWS Deploy"
run-name: "☁️ Executar deploy AWS da Auth Lambda em ${{ inputs.environment_name }}"

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment usado pelo deploy."
        required: true
        type: string
    outputs:
      terraform_action:
        description: "Ação Terraform resolvida: apply ou destroy."
        value: ${{ jobs.resolve_action.outputs.terraform_action }}

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  TERRAFORM_VERSION: "1.15.8"
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "OficinaMecanica.AuthLambda.slnx"
  FUNCTION_PROJECT_PATH: "src/OficinaMecanica.AuthLambda.Function/OficinaMecanica.AuthLambda.Function.csproj"
  LAMBDA_PACKAGE_PATH: "artifacts/auth-lambda/oficina-mecanica-auth-lambda.zip"
  SSM_VPC_PREFIX: /oficina-mecanica/development/vpc
  SSM_VPC_STATUS_PARAMETER: /oficina-mecanica/development/status/vpc
  SSM_RDS_PREFIX: /oficina-mecanica/development/rds
  SSM_RDS_STATUS_PARAMETER: /oficina-mecanica/development/status/rds
  SSM_KUBERNETES_PREFIX: /oficina-mecanica/development/kubernetes
  SSM_API_STATUS_PARAMETER: /oficina-mecanica/development/status/api
  SSM_AUTH_LAMBDA_PREFIX: /oficina-mecanica/development/auth-lambda
  SSM_AUTH_LAMBDA_STATUS_PARAMETER: /oficina-mecanica/development/status/auth-lambda
  DD_VERSION: sha-${{ github.sha }}

jobs:
  resolve_action:
    name: "🔎 01 · Resolver ação do Terraform"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      terraform_action: ${{ steps.resolve_terraform_action.outputs.terraform_action }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🛡️ Conferir habilitação do deploy AWS"
        env:
          DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          test "$DEPLOY_ENABLED" = true
          test "$GITHUB_REF" = refs/heads/develop
          test "$DEPLOY_ENVIRONMENT" = development

      - name: "🚦 02 · Ler terraform-action.env e validar troca segura de destroy"
        id: resolve_terraform_action
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          control_file="$TF_WORKING_DIRECTORY/terraform-action.env"

          if [ ! -f "$control_file" ]; then
            echo "::error::Arquivo $control_file não encontrado. Este repositório exige ação explícita do Terraform."
            exit 1
          fi

          terraform_action="$(grep -E '^[[:space:]]*TERRAFORM_ACTION[[:space:]]*=' "$control_file" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)"

          case "$terraform_action" in
            apply|destroy)
              ;;
            *)
              echo "::error::TERRAFORM_ACTION '$terraform_action' inválido. Use 'apply' ou 'destroy'."
              exit 1
              ;;
          esac

          if [ "$terraform_action" = "destroy" ]; then
            destroy_control_changed="false"

            if [ -z "$GITHUB_BEFORE" ] || [ "$GITHUB_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              destroy_control_changed="true"
            elif git diff --name-only "$GITHUB_BEFORE" "$GITHUB_AFTER" -- "$control_file" | grep -qx "$control_file"; then
              destroy_control_changed="true"
            fi

            if [ "$destroy_control_changed" != "true" ]; then
              echo "::error::TERRAFORM_ACTION=destroy está configurado, mas terraform-action.env não mudou neste push. Abra um PR dedicado de destroy."
              exit 1
            fi

            echo "::warning::TERRAFORM_ACTION=destroy detectado. Esta execução destruirá a Auth Lambda gerenciada pelo Terraform."
          fi

          if [ "$terraform_action" = "apply" ]; then
            echo "::notice::>>> AÇÃO DECIDIDA: APPLY (criar/atualizar Auth Lambda) <<<"
          else
            echo "::notice::>>> AÇÃO DECIDIDA: DESTROY (destruir Auth Lambda) <<<"
          fi

          echo "terraform_action=$terraform_action" >> "$GITHUB_OUTPUT"

  prepare_and_plan:
    name: "📋 02 · Preparar pacote e gerar plano do Terraform"
    needs: resolve_action
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      function_name_before_destroy: ${{ steps.capture_destroy_context.outputs.function_name_before_destroy }}
      function_arn: ${{ steps.read_plan_values.outputs.function_arn }}
      function_name: ${{ steps.read_plan_values.outputs.function_name }}
      security_group_id: ${{ steps.read_plan_values.outputs.security_group_id }}
    env:
      TERRAFORM_STATE_KEY: ${{ secrets.TERRAFORM_STATE_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      AUTH_LAMBDA_JWT_SECRET: ${{ secrets.AUTH_LAMBDA_JWT_SECRET }}
      CLIENTES_API_ENABLED: ${{ vars.CLIENTES_API_ENABLED || 'false' }}
      CLIENTES_INTERNOS_TOKEN: ${{ secrets.CLIENTES_INTERNOS_TOKEN }}
      AUTH_LAMBDA_EXECUTION_ROLE_NAME: ${{ vars.AUTH_LAMBDA_EXECUTION_ROLE_NAME }}
      AUTH_LAMBDA_JWT_ISSUER: ${{ vars.AUTH_LAMBDA_JWT_ISSUER || 'oficina-mecanica-auth' }}
      AUTH_LAMBDA_JWT_AUDIENCE: ${{ vars.AUTH_LAMBDA_JWT_AUDIENCE || 'oficina-mecanica-api' }}
      AUTH_LAMBDA_JWT_EXPIRATION_MINUTES: ${{ vars.AUTH_LAMBDA_JWT_EXPIRATION_MINUTES || '60' }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "🛠️ 04 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: "✅ 05 · Validar configuração necessária"
        run: |
          set -euo pipefail

          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            echo "Skipping application secret validation because this run will destroy the Auth Lambda."
            exit 0
          fi

          missing=""

          for name in AUTH_LAMBDA_JWT_SECRET AUTH_LAMBDA_EXECUTION_ROLE_NAME DD_API_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Configure no GitHub Environment development:$missing"
            exit 1
          fi

          python - <<'PY'
          import os
          import sys

          jwt_secret = os.environ["AUTH_LAMBDA_JWT_SECRET"]
          jwt_issuer = os.environ["AUTH_LAMBDA_JWT_ISSUER"]
          jwt_audience = os.environ["AUTH_LAMBDA_JWT_AUDIENCE"]
          jwt_expiration_minutes = os.environ["AUTH_LAMBDA_JWT_EXPIRATION_MINUTES"]

          if len(jwt_secret.encode("utf-8")) < 32:
              print("::error::AUTH_LAMBDA_JWT_SECRET deve ter pelo menos 32 bytes UTF-8.")
              sys.exit(1)

          if not jwt_issuer.strip():
              print("::error::AUTH_LAMBDA_JWT_ISSUER não pode estar vazio.")
              sys.exit(1)

          if not jwt_audience.strip():
              print("::error::AUTH_LAMBDA_JWT_AUDIENCE não pode estar vazio.")
              sys.exit(1)

          try:
              expiration_minutes = int(jwt_expiration_minutes)
          except ValueError:
              print("::error::AUTH_LAMBDA_JWT_EXPIRATION_MINUTES deve ser um inteiro maior que zero.")
              sys.exit(1)

          if expiration_minutes <= 0:
              print("::error::AUTH_LAMBDA_JWT_EXPIRATION_MINUTES deve ser um inteiro maior que zero.")
              sys.exit(1)
          PY

      - name: "🚦 06 · Validar dependências da VPC e RDS"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          set -euo pipefail

          vpc_status="$(aws ssm get-parameter --name "$SSM_VPC_STATUS_PARAMETER" --query 'Parameter.Value' --output text)"
          if [ "$vpc_status" != "ready" ]; then
            echo "::error::A VPC não está pronta. Esperado=ready Atual=$vpc_status"
            exit 1
          fi

          rds_status="$(aws ssm get-parameter --name "$SSM_RDS_STATUS_PARAMETER" --query 'Parameter.Value' --output text)"
          if [ "$rds_status" != "ready" ]; then
            echo "::error::O RDS não está pronto. Esperado=ready Atual=$rds_status"
            exit 1
          fi

          for parameter_name in \
            "$SSM_VPC_PREFIX/vpc_id" \
            "$SSM_VPC_PREFIX/private_subnet_ids" \
            "$SSM_RDS_PREFIX/security_group_id" \
            "$SSM_RDS_PREFIX/endpoint" \
            "$SSM_RDS_PREFIX/master_secret_arn"; do
            parameter_value="$(aws ssm get-parameter --name "$parameter_name" --query 'Parameter.Value' --output text)"

            if [ -z "$parameter_value" ] || [ "$parameter_value" = "None" ]; then
              echo "::error::Parâmetro SSM obrigatório ausente ou vazio: $parameter_name"
              exit 1
            fi
          done

          echo "Dependências de VPC e RDS validadas via SSM."

      - &protecao_artefatos
        name: "🔐 Preparar proteção de states e planos"
        run: |
          cat > "$RUNNER_TEMP/proteger-estados.cjs" <<'PROTEGER_ESTADOS'
          'use strict';
          const fs = require('node:fs'),
            path = require('node:path'),
            crypto = require('node:crypto');
          const stateFiles = ['terraform.tfstate', 'terraform.tfstate.backup'];
          const planFiles = [
            'tfplan',
            'partial_destroy_override.tf',
            'os-mensageria-destroy-context.json',
            'execucao-destroy-context.json'
          ];
          function chave(valor) {
            if (!/^[a-f0-9]{64}$/.test(valor || '')) throw Error('Chave protegida de 256 bits ausente.');
            return Buffer.from(valor, 'hex');
          }
          function contexto(env, alvo) {
            if (
              !/^\d{12}$/.test(env.AWS_ACCOUNT_ID || '') ||
              env.SSM_ENVIRONMENT_NAME !== 'development' ||
              !/^oficina-mecanica-soat\/oficina-mecanica-(api|execucao|auth-lambda)$/.test(env.GITHUB_REPOSITORY || '')
            )
              throw Error('Escopo protegido inválido.');
            let c = [env.GITHUB_REPOSITORY, env.AWS_ACCOUNT_ID, env.SSM_ENVIRONMENT_NAME, alvo];
            if (alvo === 'plan') {
              if (
                !/^[a-z]{2}-[a-z]+-\d+$/.test(env.AWS_REGION || '') ||
                !['apply', 'destroy'].includes(env.TERRAFORM_ACTION) ||
                !/^\d+$/.test(env.GITHUB_RUN_ID || '') ||
                !/^\d+$/.test(env.GITHUB_RUN_ATTEMPT || '') ||
                !/^[a-f0-9]{40}$/.test(env.GITHUB_SHA || '')
              )
                throw Error('Tentativa protegida inválida.');
              c.push(env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT, env.GITHUB_SHA, env.TERRAFORM_ACTION, env.AWS_REGION);
            }
            return c.join('|');
          }
          function selar(bytes, key, aad) {
            const iv = crypto.randomBytes(12),
              c = crypto.createCipheriv('aes-256-gcm', key, iv);
            c.setAAD(Buffer.from(aad));
            const data = Buffer.concat([c.update(bytes), c.final()]);
            return JSON.stringify({
              versao: 1,
              iv: iv.toString('base64'),
              tag: c.getAuthTag().toString('base64'),
              dados: data.toString('base64')
            });
          }
          function abrir(serializado, key, aad) {
            const e = JSON.parse(serializado);
            if (e.versao !== 1 || Object.keys(e).sort().join(',') !== 'dados,iv,tag,versao')
              throw Error('Envelope protegido inválido.');
            const iv = Buffer.from(e.iv, 'base64'),
              tag = Buffer.from(e.tag, 'base64');
            if (iv.length !== 12 || tag.length !== 16) throw Error('Autenticação inválida.');
            const d = crypto.createDecipheriv('aes-256-gcm', key, iv);
            d.setAAD(Buffer.from(aad));
            d.setAuthTag(tag);
            return Buffer.concat([d.update(Buffer.from(e.dados, 'base64')), d.final()]);
          }
          function main(modo, env = process.env) {
            const dir = env.TF_WORKING_DIRECTORY,
              key = chave(env.TERRAFORM_STATE_KEY);
            if (!dir) throw Error('Diretório protegido ausente.');
            if (modo === 'state-open' || modo === 'state-seal') {
              const aad = contexto(env, 'state');
              for (const nome of stateFiles) {
                const raw = path.join(dir, nome),
                  enc = raw + '.enc';
                if (modo === 'state-open') {
                  if (fs.existsSync(raw)) throw Error('State plaintext inesperado antes de restaurar.');
                  if (fs.existsSync(enc))
                    fs.writeFileSync(raw, abrir(fs.readFileSync(enc, 'utf8'), key, aad + '|' + nome), { mode: 0o600 });
                } else if (fs.existsSync(raw))
                  fs.writeFileSync(enc, selar(fs.readFileSync(raw), key, aad + '|' + nome), { mode: 0o600 });
              }
              return;
            }
            const bundle = path.join(dir, 'tfplan.bundle.enc'),
              aad = contexto(env, 'plan');
            if (modo === 'plan-seal') {
              const arquivos = {};
              for (const nome of planFiles) {
                const f = path.join(dir, nome);
                if (fs.existsSync(f)) arquivos[nome] = fs.readFileSync(f).toString('base64');
              }
              for (const nome of planFiles.slice(0, 1))
                if (!arquivos[nome]) throw Error('Plano obrigatório incompleto.');
              fs.writeFileSync(bundle, selar(Buffer.from(JSON.stringify(arquivos)), key, aad), { mode: 0o600 });
            } else if (modo === 'plan-open') {
              const arquivos = JSON.parse(abrir(fs.readFileSync(bundle, 'utf8'), key, aad));
              if (!arquivos || Array.isArray(arquivos) || Object.keys(arquivos).some((n) => !planFiles.includes(n)))
                throw Error('Pacote tenta gravar arquivo fora do plano.');
              for (const nome of planFiles.slice(0, 1))
                if (typeof arquivos[nome] !== 'string' || !arquivos[nome]) throw Error('Plano obrigatório ausente.');
              for (const [nome, dados] of Object.entries(arquivos)) {
                if (typeof dados !== 'string') throw Error('Conteúdo inválido.');
                fs.writeFileSync(path.join(dir, nome), Buffer.from(dados, 'base64'), { mode: 0o600 });
              }
            } else throw Error('Operação protegida desconhecida.');
          }
          module.exports = { chave, contexto, selar, abrir, main };
          if (require.main === module) {
            try {
              main(process.argv[2]);
              console.log('Artefatos protegidos: ' + process.argv[2] + '.');
            } catch {
              console.error('Proteção dos artefatos falhou; não publicar nem substituir state.');
              process.exit(1);
            }
          }
          PROTEGER_ESTADOS

      - name: "📦 07 · Restaurar cache do state Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.enc
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup.enc
          key: tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-

      - name: "🔓 Restaurar state autenticado"
        id: restaurar_state_protegido
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-estados.cjs" state-open

      - name: "📚 08 · Resolver dependências da solução"
        run: dotnet restore "$SOLUTION_PATH"

      - name: "📤 09 · Publicar projeto da Function"
        run: >
          dotnet publish "$FUNCTION_PROJECT_PATH"
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output ./artifacts/auth-lambda/publish

      - name: "🗜️ 10 · Compactar pacote da Lambda"
        run: |
          set -euo pipefail

          publish_path="./artifacts/auth-lambda/publish"
          zip_path="$LAMBDA_PACKAGE_PATH"

          test -d "$publish_path" || { echo "::error::Diretório de publish não foi gerado."; exit 1; }

          mkdir -p "$(dirname "$zip_path")"
          (
            cd "$publish_path"
            zip -r "$GITHUB_WORKSPACE/$zip_path" .
          )

      - name: "✅ 11 · Validar pacote e calcular hash"
        id: package
        run: |
          set -euo pipefail

          test -f "$LAMBDA_PACKAGE_PATH" || { echo "::error::Pacote da Lambda não foi gerado."; exit 1; }

          package_size="$(stat -c%s "$LAMBDA_PACKAGE_PATH")"
          if [ "$package_size" -le 0 ]; then
            echo "::error::Pacote da Lambda está vazio."
            exit 1
          fi

          package_hash="$(openssl dgst -sha256 -binary "$LAMBDA_PACKAGE_PATH" | openssl base64 -A)"

          echo "package_size=$package_size" >> "$GITHUB_OUTPUT"
          echo "package_hash=$package_hash" >> "$GITHUB_OUTPUT"
          echo "Pacote da Lambda gerado com $package_size bytes."

      - name: "📝 12 · Escrever variáveis do Terraform"
        env:
          LAMBDA_PACKAGE_SOURCE_CODE_HASH: ${{ steps.package.outputs.package_hash }}
        run: |
          set -euo pipefail
          umask 077

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def aws_output(*args):
              result = subprocess.run(
                  ["aws", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip()

          clientes_api_habilitada = False
          clientes_api_endereco_base = ""
          clientes_api_token = ""
          if os.environ["TERRAFORM_ACTION"] != "destroy":
              valor_habilitado = os.environ.get("CLIENTES_API_ENABLED", "false")
              if valor_habilitado not in ("true", "false"):
                  raise ValueError("CLIENTES_API_ENABLED deve ser true ou false.")
              clientes_api_habilitada = valor_habilitado == "true"
              if clientes_api_habilitada:
                  clientes_api_token = os.environ.get("CLIENTES_INTERNOS_TOKEN", "")
                  if not 32 <= len(clientes_api_token) <= 256 or any(not "!" <= c <= "~" for c in clientes_api_token):
                      raise ValueError("Configure uma credencial técnica válida para a consulta privada de clientes.")
                  if clientes_api_token == os.environ.get("AUTH_LAMBDA_JWT_SECRET"):
                      raise ValueError("A credencial técnica deve ser segregada do JWT.")
                  print(f"::add-mask::{clientes_api_token}")
                  estado_api = aws_output("ssm", "get-parameter", "--name", os.environ["SSM_API_STATUS_PARAMETER"], "--query", "Parameter.Value", "--output", "text")
                  if estado_api != "ready":
                      raise ValueError("A API precisa estar ready antes de selecionar a consulta privada de clientes.")
                  prefixo = os.environ["SSM_KUBERNETES_PREFIX"]
                  listener_arn = aws_output("ssm", "get-parameter", "--name", f"{prefixo}/internal_nlb_listener_arn", "--query", "Parameter.Value", "--output", "text")
                  nlb_sg = aws_output("ssm", "get-parameter", "--name", f"{prefixo}/internal_nlb_security_group_id", "--query", "Parameter.Value", "--output", "text")
                  vpc_id = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_VPC_PREFIX']}/vpc_id", "--query", "Parameter.Value", "--output", "text")
                  conta = aws_output("sts", "get-caller-identity", "--query", "Account", "--output", "text")
                  if not listener_arn.startswith(f"arn:aws:elasticloadbalancing:{os.environ['AWS_REGION']}:{conta}:listener/net/"):
                      raise ValueError("O listener privado deve pertencer à conta e região atuais.")
                  listeners = json.loads(aws_output("elbv2", "describe-listeners", "--listener-arns", listener_arn, "--output", "json"))["Listeners"]
                  if len(listeners) != 1 or listeners[0]["Protocol"] != "TCP" or listeners[0]["Port"] != 80:
                      raise ValueError("O listener privado de OS deve usar TCP na porta 80.")
                  balancers = json.loads(aws_output("elbv2", "describe-load-balancers", "--load-balancer-arns", listeners[0]["LoadBalancerArn"], "--output", "json"))["LoadBalancers"]
                  if len(balancers) != 1:
                      raise ValueError("O listener deve identificar um único NLB privado.")
                  nlb = balancers[0]
                  if nlb["Type"] != "network" or nlb["Scheme"] != "internal" or nlb["VpcId"] != vpc_id or nlb_sg not in nlb.get("SecurityGroups", []):
                      raise ValueError("O NLB deve preservar a VPC e o security group publicados pelo Kubernetes.")
                  import re
                  dns = nlb["DNSName"]
                  if not re.fullmatch(r"[a-zA-Z0-9.-]+\.elb\.[a-z0-9-]+\.amazonaws\.com", dns):
                      raise ValueError("DNS do NLB privado inválido.")
                  clientes_api_endereco_base = f"http://{dns}"
          if os.environ["TERRAFORM_ACTION"] == "destroy":
              connection_string = "Server=destroy-only;Database=destroy-only;User Id=destroy-only;Password=DestroyOnly-2026!;TrustServerCertificate=True"
              jwt_secret = "destroy-only-placeholder-secret-with-at-least-32-bytes"
              lambda_execution_role_name = os.environ.get("AUTH_LAMBDA_EXECUTION_ROLE_NAME", "DestroyOnlyRole")
          elif clientes_api_habilitada:
              connection_string = ""
              jwt_secret = os.environ["AUTH_LAMBDA_JWT_SECRET"]
              lambda_execution_role_name = os.environ["AUTH_LAMBDA_EXECUTION_ROLE_NAME"]
          else:
              endpoint = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_RDS_PREFIX']}/endpoint", "--query", "Parameter.Value", "--output", "text")
              secret_arn = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_RDS_PREFIX']}/master_secret_arn", "--query", "Parameter.Value", "--output", "text")
              if not endpoint or not secret_arn:
                  raise ValueError("RDS endpoint ou ARN do segredo não foi publicado.")
              secret_string = aws_output("secretsmanager", "get-secret-value", "--secret-id", secret_arn, "--query", "SecretString", "--output", "text")
              try:
                  secret = json.loads(secret_string)
              except json.JSONDecodeError as error:
                  raise ValueError("SecretString do RDS não contém JSON válido.") from error
              username = secret.get("username")
              password = secret.get("password")
              if not username or not password:
                  raise ValueError("SecretString do RDS não contém username e password.")
              connection_string = f"Server=tcp:{endpoint},1433;Database=OficinaMecanicaDb;User Id={username};Password={password};TrustServerCertificate=True;"
              print(f"::add-mask::{username}")
              print(f"::add-mask::{password}")
              print(f"::add-mask::{connection_string}")
              jwt_secret = os.environ["AUTH_LAMBDA_JWT_SECRET"]
              lambda_execution_role_name = os.environ["AUTH_LAMBDA_EXECUTION_ROLE_NAME"]

          values = {
              "aws_region": os.environ["AWS_REGION"],
              "lambda_execution_role_name": lambda_execution_role_name,
              "lambda_package_file_path": "../../../../artifacts/auth-lambda/oficina-mecanica-auth-lambda.zip",
              "lambda_package_source_code_hash": os.environ["LAMBDA_PACKAGE_SOURCE_CODE_HASH"],
              "connection_string": connection_string,
              "clientes_api_habilitada": clientes_api_habilitada,
              "clientes_api_endereco_base": clientes_api_endereco_base,
              "clientes_api_token": clientes_api_token,
              "jwt_secret": jwt_secret,
              "jwt_issuer": os.environ["AUTH_LAMBDA_JWT_ISSUER"],
              "jwt_audience": os.environ["AUTH_LAMBDA_JWT_AUDIENCE"],
              "jwt_expiration_minutes": int(os.environ["AUTH_LAMBDA_JWT_EXPIRATION_MINUTES"]),
              "datadog_version": os.environ["DD_VERSION"],
          }

          target = Path(os.environ["TF_WORKING_DIRECTORY"]) / "zz_ci.auto.tfvars.json"
          target.write_text(json.dumps(values), encoding="utf-8")
          PY

      - name: "🛡️ Validar state da conta AWS atual"
        run: node .github/scripts/bootstrap-account-state.cjs

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs

      - name: "🚀 13 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "🔍 14 · Validar configuração Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: "🛡️ 15 · Capturar Auth Lambda atual antes do destroy"
        id: capture_destroy_context
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          set -euo pipefail

          function_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.auth_lambda_function_name.value // empty')"
          if [ -z "$function_name" ]; then
            if ssm_output="$(aws ssm get-parameter --name "$SSM_AUTH_LAMBDA_PREFIX/function_name" --query 'Parameter.Value' --output text 2>&1)"; then
              function_name="$ssm_output"
            elif [[ "$ssm_output" == *"(ParameterNotFound)"* ]]; then
              function_name="oficina-mecanica-auth-lambda-dev"
            else
              echo "::error::Falha ao consultar SSM; ausência não comprovada."
              exit 1
            fi
          fi
          if function_output="$(aws lambda get-function-configuration --function-name "$function_name" --query 'FunctionName' --output text 2>&1)"; then
            echo "Auth Lambda existe e será validada após destroy."
          elif [[ "$function_output" == *"(ResourceNotFoundException)"* ]]; then
            echo "Auth Lambda comprovadamente ausente."
          else
            echo "::error::Falha ao consultar Lambda; ausência não comprovada."
            exit 1
          fi

          echo "function_name_before_destroy=$function_name" >> "$GITHUB_OUTPUT"

      - name: "📐 16 · Gerar plano do Terraform (apply)"
        if: env.TERRAFORM_ACTION == 'apply'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -input=false -out=tfplan

      - name: "📐 16 · Gerar plano do Terraform (destroy)"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -destroy -input=false -out=tfplan

      - name: "📖 17 · Ler outputs planejados quando disponíveis"
        id: read_plan_values
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          set -euo pipefail

          function_arn="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.auth_lambda_function_arn.value // empty')"
          function_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.auth_lambda_function_name.value // empty')"
          security_group_id="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -json | jq -r '.auth_lambda_security_group_id.value // empty')"

          echo "function_arn=$function_arn" >> "$GITHUB_OUTPUT"
          echo "function_name=$function_name" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$security_group_id" >> "$GITHUB_OUTPUT"

      - name: "🔐 Cifrar plano vinculado à tentativa"
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-estados.cjs" plan-seal

      - name: "⬆️ 18 · Publicar plano do Terraform como artefato"
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-auth-lambda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/tfplan.bundle.enc
          retention-days: 1
          if-no-files-found: error

      - name: "⬆️ 19 · Publicar pacote da Lambda como artefato"
        uses: actions/upload-artifact@v7
        with:
          name: auth-lambda-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAMBDA_PACKAGE_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: "🧹 20 · Remover variáveis sensíveis temporárias"
        if: always()
        run: rm -f "$TF_WORKING_DIRECTORY/zz_ci.auto.tfvars.json"

  apply_or_destroy:
    name: "☁️ 03 · Aplicar ou destruir Auth Lambda"
    needs:
      - resolve_action
      - prepare_and_plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    env:
      TERRAFORM_STATE_KEY: ${{ secrets.TERRAFORM_STATE_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TERRAFORM_ACTION: ${{ needs.resolve_action.outputs.terraform_action }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      AUTH_LAMBDA_JWT_SECRET: ${{ secrets.AUTH_LAMBDA_JWT_SECRET }}
      CLIENTES_API_ENABLED: ${{ vars.CLIENTES_API_ENABLED || 'false' }}
      CLIENTES_INTERNOS_TOKEN: ${{ secrets.CLIENTES_INTERNOS_TOKEN }}
      AUTH_LAMBDA_EXECUTION_ROLE_NAME: ${{ vars.AUTH_LAMBDA_EXECUTION_ROLE_NAME }}
      AUTH_LAMBDA_JWT_ISSUER: ${{ vars.AUTH_LAMBDA_JWT_ISSUER || 'oficina-mecanica-auth' }}
      AUTH_LAMBDA_JWT_AUDIENCE: ${{ vars.AUTH_LAMBDA_JWT_AUDIENCE || 'oficina-mecanica-api' }}
      AUTH_LAMBDA_JWT_EXPIRATION_MINUTES: ${{ vars.AUTH_LAMBDA_JWT_EXPIRATION_MINUTES || '60' }}
      FUNCTION_NAME_BEFORE_DESTROY: ${{ needs.prepare_and_plan.outputs.function_name_before_destroy }}

    steps:
      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🔑 02 · Configurar credenciais AWS"
        uses: aws-actions/configure-aws-credentials@v6
        id: aws_credentials
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - *protecao_artefatos

      - name: "📦 04 · Restaurar cache do state Terraform"
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.enc
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup.enc
          key: tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-

      - name: "🔓 Restaurar state autenticado"
        id: restaurar_state_protegido
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-estados.cjs" state-open

      - name: "⬇️ 05 · Baixar plano do Terraform publicado"
        uses: actions/download-artifact@v8
        with:
          name: tfplan-auth-lambda-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - name: "🔓 Validar e abrir plano desta tentativa"
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-estados.cjs" plan-open

      - name: "⬇️ 06 · Baixar pacote da Lambda planejado"
        uses: actions/download-artifact@v8
        with:
          name: auth-lambda-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/auth-lambda

      - name: "✅ 07 · Validar pacote baixado"
        id: package
        run: |
          set -euo pipefail

          test -f "$LAMBDA_PACKAGE_PATH" || { echo "::error::Pacote da Lambda não foi baixado no caminho esperado."; exit 1; }

          package_size="$(stat -c%s "$LAMBDA_PACKAGE_PATH")"
          if [ "$package_size" -le 0 ]; then
            echo "::error::Pacote da Lambda está vazio."
            exit 1
          fi

          package_hash="$(openssl dgst -sha256 -binary "$LAMBDA_PACKAGE_PATH" | openssl base64 -A)"
          echo "package_hash=$package_hash" >> "$GITHUB_OUTPUT"
          echo "Pacote planejado baixado com $package_size bytes."

      - name: "📝 08 · Reescrever variáveis do Terraform"
        env:
          LAMBDA_PACKAGE_SOURCE_CODE_HASH: ${{ steps.package.outputs.package_hash }}
        run: |
          set -euo pipefail
          umask 077

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def aws_output(*args):
              result = subprocess.run(
                  ["aws", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip()

          clientes_api_habilitada = False
          clientes_api_endereco_base = ""
          clientes_api_token = ""
          if os.environ["TERRAFORM_ACTION"] != "destroy":
              valor_habilitado = os.environ.get("CLIENTES_API_ENABLED", "false")
              if valor_habilitado not in ("true", "false"):
                  raise ValueError("CLIENTES_API_ENABLED deve ser true ou false.")
              clientes_api_habilitada = valor_habilitado == "true"
              if clientes_api_habilitada:
                  clientes_api_token = os.environ.get("CLIENTES_INTERNOS_TOKEN", "")
                  if not 32 <= len(clientes_api_token) <= 256 or any(not "!" <= c <= "~" for c in clientes_api_token):
                      raise ValueError("Configure uma credencial técnica válida para a consulta privada de clientes.")
                  if clientes_api_token == os.environ.get("AUTH_LAMBDA_JWT_SECRET"):
                      raise ValueError("A credencial técnica deve ser segregada do JWT.")
                  print(f"::add-mask::{clientes_api_token}")
                  estado_api = aws_output("ssm", "get-parameter", "--name", os.environ["SSM_API_STATUS_PARAMETER"], "--query", "Parameter.Value", "--output", "text")
                  if estado_api != "ready":
                      raise ValueError("A API precisa estar ready antes de selecionar a consulta privada de clientes.")
                  prefixo = os.environ["SSM_KUBERNETES_PREFIX"]
                  listener_arn = aws_output("ssm", "get-parameter", "--name", f"{prefixo}/internal_nlb_listener_arn", "--query", "Parameter.Value", "--output", "text")
                  nlb_sg = aws_output("ssm", "get-parameter", "--name", f"{prefixo}/internal_nlb_security_group_id", "--query", "Parameter.Value", "--output", "text")
                  vpc_id = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_VPC_PREFIX']}/vpc_id", "--query", "Parameter.Value", "--output", "text")
                  conta = aws_output("sts", "get-caller-identity", "--query", "Account", "--output", "text")
                  if not listener_arn.startswith(f"arn:aws:elasticloadbalancing:{os.environ['AWS_REGION']}:{conta}:listener/net/"):
                      raise ValueError("O listener privado deve pertencer à conta e região atuais.")
                  listeners = json.loads(aws_output("elbv2", "describe-listeners", "--listener-arns", listener_arn, "--output", "json"))["Listeners"]
                  if len(listeners) != 1 or listeners[0]["Protocol"] != "TCP" or listeners[0]["Port"] != 80:
                      raise ValueError("O listener privado de OS deve usar TCP na porta 80.")
                  balancers = json.loads(aws_output("elbv2", "describe-load-balancers", "--load-balancer-arns", listeners[0]["LoadBalancerArn"], "--output", "json"))["LoadBalancers"]
                  if len(balancers) != 1:
                      raise ValueError("O listener deve identificar um único NLB privado.")
                  nlb = balancers[0]
                  if nlb["Type"] != "network" or nlb["Scheme"] != "internal" or nlb["VpcId"] != vpc_id or nlb_sg not in nlb.get("SecurityGroups", []):
                      raise ValueError("O NLB deve preservar a VPC e o security group publicados pelo Kubernetes.")
                  import re
                  dns = nlb["DNSName"]
                  if not re.fullmatch(r"[a-zA-Z0-9.-]+\.elb\.[a-z0-9-]+\.amazonaws\.com", dns):
                      raise ValueError("DNS do NLB privado inválido.")
                  clientes_api_endereco_base = f"http://{dns}"
          if os.environ["TERRAFORM_ACTION"] == "destroy":
              connection_string = "Server=destroy-only;Database=destroy-only;User Id=destroy-only;Password=DestroyOnly-2026!;TrustServerCertificate=True"
              jwt_secret = "destroy-only-placeholder-secret-with-at-least-32-bytes"
              lambda_execution_role_name = os.environ.get("AUTH_LAMBDA_EXECUTION_ROLE_NAME", "DestroyOnlyRole")
          elif clientes_api_habilitada:
              connection_string = ""
              jwt_secret = os.environ["AUTH_LAMBDA_JWT_SECRET"]
              lambda_execution_role_name = os.environ["AUTH_LAMBDA_EXECUTION_ROLE_NAME"]
          else:
              endpoint = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_RDS_PREFIX']}/endpoint", "--query", "Parameter.Value", "--output", "text")
              secret_arn = aws_output("ssm", "get-parameter", "--name", f"{os.environ['SSM_RDS_PREFIX']}/master_secret_arn", "--query", "Parameter.Value", "--output", "text")
              if not endpoint or not secret_arn:
                  raise ValueError("RDS endpoint ou ARN do segredo não foi publicado.")
              secret_string = aws_output("secretsmanager", "get-secret-value", "--secret-id", secret_arn, "--query", "SecretString", "--output", "text")
              try:
                  secret = json.loads(secret_string)
              except json.JSONDecodeError as error:
                  raise ValueError("SecretString do RDS não contém JSON válido.") from error
              username = secret.get("username")
              password = secret.get("password")
              if not username or not password:
                  raise ValueError("SecretString do RDS não contém username e password.")
              connection_string = f"Server=tcp:{endpoint},1433;Database=OficinaMecanicaDb;User Id={username};Password={password};TrustServerCertificate=True;"
              print(f"::add-mask::{username}")
              print(f"::add-mask::{password}")
              print(f"::add-mask::{connection_string}")
              jwt_secret = os.environ["AUTH_LAMBDA_JWT_SECRET"]
              lambda_execution_role_name = os.environ["AUTH_LAMBDA_EXECUTION_ROLE_NAME"]

          values = {
              "aws_region": os.environ["AWS_REGION"],
              "lambda_execution_role_name": lambda_execution_role_name,
              "lambda_package_file_path": "../../../../artifacts/auth-lambda/oficina-mecanica-auth-lambda.zip",
              "lambda_package_source_code_hash": os.environ["LAMBDA_PACKAGE_SOURCE_CODE_HASH"],
              "connection_string": connection_string,
              "clientes_api_habilitada": clientes_api_habilitada,
              "clientes_api_endereco_base": clientes_api_endereco_base,
              "clientes_api_token": clientes_api_token,
              "jwt_secret": jwt_secret,
              "jwt_issuer": os.environ["AUTH_LAMBDA_JWT_ISSUER"],
              "jwt_audience": os.environ["AUTH_LAMBDA_JWT_AUDIENCE"],
              "jwt_expiration_minutes": int(os.environ["AUTH_LAMBDA_JWT_EXPIRATION_MINUTES"]),
              "datadog_version": os.environ["DD_VERSION"],
          }

          target = Path(os.environ["TF_WORKING_DIRECTORY"]) / "zz_ci.auto.tfvars.json"
          target.write_text(json.dumps(values), encoding="utf-8")
          PY

      - name: "🛡️ Validar state da conta AWS atual"
        run: node .github/scripts/bootstrap-account-state.cjs

      - name: "🛡️ Preparar configuração exclusiva de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs

      - name: "🚀 09 · Inicializar Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" init -input=false

      - name: "🛡️ Validar plano exclusivo de destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-plan

      - name: "✅ 10 · Aplicar plano do Terraform"
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfplan

      - name: "🔎 Confirmar state sem recursos gerenciados"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: node .github/scripts/prepare-destroy.cjs verify-state

      - name: "🔐 Cifrar state inclusive após falha parcial"
        id: cifrar_state_0
        if: always() && steps.restaurar_state_protegido.outcome == 'success'
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws_credentials.outputs.aws-account-id }}
        run: node "$RUNNER_TEMP/proteger-estados.cjs" state-seal

      - name: "💾 11 · Salvar cache final do state Terraform"
        if: always() && steps.cifrar_state_0.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.enc
            ${{ env.TF_WORKING_DIRECTORY }}/terraform.tfstate.backup.enc
          key: tfstate-enc-v1-${{ steps.aws_credentials.outputs.aws-account-id }}-${{ inputs.environment_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "🔐 12 · Popular API key no Secrets Manager"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          set -euo pipefail

          if [ -z "$DD_API_KEY" ]; then
            echo "::error::Configure o GitHub Environment secret DD_API_KEY."
            exit 1
          fi

          echo "::add-mask::$DD_API_KEY"
          datadog_secret_arn="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw datadog_api_key_secret_arn)"
          test -n "$datadog_secret_arn" || { echo "::error::ARN do secret Datadog não foi produzido pelo Terraform."; exit 1; }

          aws secretsmanager put-secret-value \
            --secret-id "$datadog_secret_arn" \
            --secret-string "$DD_API_KEY" \
            --query VersionId \
            --output text > /dev/null

          echo "API key do Datadog atualizada no Secrets Manager."

      - name: "🔎 13 · Validar Auth Lambda real após apply"
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          set -euo pipefail

          function_name="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw auth_lambda_function_name)"
          function_arn="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw auth_lambda_function_arn)"
          security_group_id="$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw auth_lambda_security_group_id)"

          for attempt in $(seq 1 30); do
            function_state="$(aws lambda get-function-configuration --function-name "$function_name" --query 'State' --output text)"

            if [ "$function_state" = "Active" ]; then
              break
            fi

            echo "Aguardando Lambda ficar Active. Tentativa $attempt/30. Estado atual: $function_state"
            sleep 10
          done

          runtime="$(aws lambda get-function-configuration --function-name "$function_name" --query 'Runtime' --output text)"
          role="$(aws lambda get-function-configuration --function-name "$function_name" --query 'Role' --output text)"
          subnet_count="$(aws lambda get-function-configuration --function-name "$function_name" --query 'length(VpcConfig.SubnetIds)' --output text)"
          security_group_count="$(aws lambda get-function-configuration --function-name "$function_name" --query 'length(VpcConfig.SecurityGroupIds)' --output text)"

          test "$(aws lambda get-function-configuration --function-name "$function_name" --query 'State' --output text)" = "Active"
          test "$runtime" = "dotnet10"
          test -n "$role"
          test "$subnet_count" -gt 0
          test "$security_group_count" -gt 0

          test "$(aws ssm get-parameter --name "$SSM_AUTH_LAMBDA_PREFIX/function_arn" --query 'Parameter.Value' --output text)" = "$function_arn"
          test "$(aws ssm get-parameter --name "$SSM_AUTH_LAMBDA_PREFIX/function_name" --query 'Parameter.Value' --output text)" = "$function_name"
          test "$(aws ssm get-parameter --name "$SSM_AUTH_LAMBDA_PREFIX/security_group_id" --query 'Parameter.Value' --output text)" = "$security_group_id"
          test "$(aws ssm get-parameter --name "$SSM_AUTH_LAMBDA_STATUS_PARAMETER" --query 'Parameter.Value' --output text)" = "ready"

          if [ "$CLIENTES_API_ENABLED" = "true" ]; then
            FUNCTION_NAME="$function_name" python - <<'VALIDAR_CONSULTA_PRIVADA'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          # Documento sintético válido: 200 ou 401 confirmam a consulta; 503 bloqueia.
          evento = {"version": "2.0", "body": json.dumps({"documento": "52998224725"})}
          with tempfile.TemporaryDirectory() as pasta:
              resposta = Path(pasta) / "resposta.json"
              resultado = subprocess.run([
                  "aws", "lambda", "invoke", "--function-name", os.environ["FUNCTION_NAME"],
                  "--cli-binary-format", "raw-in-base64-out", "--payload", json.dumps(evento),
                  str(resposta), "--output", "json"
              ], check=True, capture_output=True, text=True)
              metadados = json.loads(resultado.stdout)
              retorno = json.loads(resposta.read_text(encoding="utf-8"))
              if metadados.get("FunctionError") or metadados.get("StatusCode") != 200 or retorno.get("statusCode") not in (200, 401):
                  raise ValueError("A consulta privada Lambda → OS não foi confirmada; implantação bloqueada.")
          print("Consulta privada Lambda → OS confirmada, sem registrar documento, token ou resposta.")
          VALIDAR_CONSULTA_PRIVADA
          fi

          echo "Auth Lambda $function_name validada com sucesso na AWS e no SSM."

      - name: "🔎 13 · Validar remoção real após destroy"
        if: env.TERRAFORM_ACTION == 'destroy'
        run: |
          set -euo pipefail

          assert_resource_absent() {
            local resource_label="$1"
            shift
            local command_output

            if command_output="$("$@" 2>&1)"; then
              echo "::error::${resource_label} ainda existe após destroy."
              return 1
            else
              local command_status=$?
              case "$command_output" in
                *ResourceNotFoundException*|*ParameterNotFound*)
                  echo "${resource_label} ausente após destroy."
                  return 0
                  ;;
                *)
                  echo "::error::Não foi possível confirmar remoção de ${resource_label}. O erro não confirma ausência."
                  echo "$command_output"
                  return "$command_status"
                  ;;
              esac
            fi
          }

          if [ -z "$FUNCTION_NAME_BEFORE_DESTROY" ]; then
            echo "::warning::Nome da Auth Lambda ausente antes do destroy; não há identificador para validar a função."
          else
            assert_resource_absent "Auth Lambda $FUNCTION_NAME_BEFORE_DESTROY" aws lambda get-function-configuration --function-name "$FUNCTION_NAME_BEFORE_DESTROY" --query 'FunctionName' --output text
          fi

          for parameter_name in \
            "$SSM_AUTH_LAMBDA_PREFIX/function_arn" \
            "$SSM_AUTH_LAMBDA_PREFIX/function_name" \
            "$SSM_AUTH_LAMBDA_PREFIX/security_group_id" \
            "$SSM_AUTH_LAMBDA_STATUS_PARAMETER"; do
            assert_resource_absent "SSM parameter $parameter_name" aws ssm get-parameter --name "$parameter_name" --query 'Parameter.Value' --output text
          done

          echo "Auth Lambda e parâmetros SSM publicados foram removidos."

      - name: "🧹 14 · Remover variáveis sensíveis temporárias"
        if: always()
        run: rm -f "$TF_WORKING_DIRECTORY/zz_ci.auto.tfvars.json"
